<title>PlanPres</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ERP shell — dark machine-room sidebar, light working surface, dense tables, Gantt as the hero view */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F7F9FA; --ink:#15202B; --muted:#5A6774; --line:#DCE2E7;
  --side:#14283A; --side-2:#1C3549; --side-ink:#C4D2DE; --side-muted:#7F95A8;
  --accent:#1E6BAE; --accent-ink:#FFFFFF; --accent-soft:#E3EEF8;
  --amber:#E8A317; --amber-ink:#1F1600;
  --ok:#1D8556; --ok-bg:#E1F3EA; --warn:#B86E00; --warn-bg:#FCEFD9; --bad:#C2352B; --bad-bg:#FBE4E2;
  --m-pp:#2F7FC1; --m-abs:#E07A1F; --m-pa:#7B57C2; --m-hdpe:#2E9A62; --m-x1:#B8466B; --m-x2:#5F7D8C;
  --hatch:#C9D1D8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --f-display:"Barlow Semi Condensed","Barlow","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#152029; --surface-2:#1A2731; --ink:#E2E9EF; --muted:#94A4B2; --line:#26343F;
  --side:#09111A; --side-2:#132230; --side-ink:#C4D2DE; --side-muted:#71879A;
  --accent:#5DA5E6; --accent-ink:#06121D; --accent-soft:#16334B;
  --amber:#F2B530; --amber-ink:#1F1600;
  --ok:#47C487; --ok-bg:#12352A; --warn:#EBA43D; --warn-bg:#3A2A10; --bad:#F06C60; --bad-bg:#3D1A18;
  --m-pp:#5AA1DE; --m-abs:#F0954A; --m-pa:#A386E0; --m-hdpe:#4FBE84; --m-x1:#DB6E92; --m-x2:#86A3B1;
  --hatch:#34434F; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#152029; --surface-2:#1A2731; --ink:#E2E9EF; --muted:#94A4B2; --line:#26343F;
  --side:#09111A; --side-2:#132230; --side-ink:#C4D2DE; --side-muted:#71879A;
  --accent:#5DA5E6; --accent-ink:#06121D; --accent-soft:#16334B;
  --amber:#F2B530; --amber-ink:#1F1600;
  --ok:#47C487; --ok-bg:#12352A; --warn:#EBA43D; --warn-bg:#3A2A10; --bad:#F06C60; --bad-bg:#3D1A18;
  --m-pp:#5AA1DE; --m-abs:#F0954A; --m-pa:#A386E0; --m-hdpe:#4FBE84; --m-x1:#DB6E92; --m-x2:#86A3B1;
  --hatch:#34434F; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86em}

.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding-block:18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));padding-left:max(0px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--amber);display:grid;place-items:center;color:var(--amber-ink);font-family:var(--f-display);font-weight:700;font-size:15px}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;color:#fff}
.brand-sub{font-size:11px;color:var(--side-muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--side-ink);font-weight:500;font-size:14.5px}
.nav button:hover{background:var(--side-2);color:#fff}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
.nav button:focus-visible{outline:2px solid var(--amber)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--side-muted)}
.side-foot{margin-top:auto;padding:0 18px;font-size:12px;color:var(--side-muted)}.ord{font-size:11px;color:var(--muted);font-family:inherit;white-space:nowrap}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.page-title{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-demo{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.content{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn-plan{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-family:var(--f-display);font-size:16px;letter-spacing:.03em;padding:7px 16px}
.btn-plan:hover{filter:brightness(1.06);color:var(--amber-ink);border-color:var(--amber)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn-ghost{border-color:transparent;background:transparent}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
.panel-sub{font-size:13px;color:var(--muted)}
.panel-body{padding:16px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.search{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 10px;width:200px;max-width:100%}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpis.kpis-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-bar.short{box-shadow:inset 0 -5px 0 var(--amber)}
tr.mrp-detail>td{background:var(--surface-2);padding:8px 12px 12px;white-space:normal}
tr.mrp-detail table{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-val{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.kpi-foot{font-size:12.5px;color:var(--muted)}
.kpi.is-bad .kpi-val{color:var(--bad)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
tr.clickable{cursor:pointer}
.code{font-family:var(--f-mono);font-size:13px;font-weight:500}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-bad{background:var(--bad-bg);color:var(--bad)}
.mat{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.mat i{width:10px;height:10px;border-radius:2px;display:inline-block}
.mchip{display:inline-block;font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:3px}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 6px;font-size:13.5px}
.sel.override{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}

.load-list{display:flex;flex-direction:column;gap:10px}
.load-row{display:grid;grid-template-columns:64px minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13.5px}
.load-bar{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.load-bar span{position:absolute;inset:0 auto 0 0;border-radius:2px}
.load-bar .limit{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--muted);left:85%}

.gantt-wrap{overflow-x:auto}
.gantt{position:relative;min-width:max-content}
.g-head,.g-row{display:flex}
.mode{font-size:12.5px;font-weight:600;color:var(--muted)}.mode.is-r{color:var(--accent)}.mode.is-o{color:var(--warn)}
.g-label{width:132px;flex:none;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line);padding:0 12px;display:flex;flex-direction:column;justify-content:center}
.g-head .g-label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);height:44px}
.g-days{display:flex}
.g-day{flex:none;border-left:1px solid var(--line);height:44px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.g-day b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-size:11.5px}
.g-day.today{background:var(--accent-soft)}
.g-row{border-top:1px solid var(--line);height:52px}
.g-row .g-label b{font-family:var(--f-mono);font-size:13.5px}
.g-row .g-label span{font-size:11.5px;color:var(--muted)}
.g-track{position:relative;flex:none;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px)}
.g-bar{position:absolute;top:9px;height:34px;border-radius:4px;color:#fff;font-size:11.5px;font-weight:600;padding:2px 6px;overflow:hidden;white-space:nowrap;line-height:1.25;cursor:default;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.g-bar small{display:block;font-weight:500;opacity:.9;font-family:var(--f-mono);font-size:10.5px}
.g-bar{border:0;text-align:left;font-family:inherit;cursor:grab;touch-action:none;user-select:none}
.g-bar.dragging{opacity:.3}
.g-bar.run{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px);cursor:default}
.g-wait{position:absolute;top:13px;height:26px;border:1.5px dashed var(--bad);border-radius:3px;background:var(--bad-bg)}
.run-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.run-label{font-weight:700;font-size:13.5px}
.run-chip{background:var(--ok-bg);color:var(--ok)}
.g-bar.ghost{position:fixed;z-index:80;pointer-events:none;opacity:.92;cursor:grabbing;box-shadow:0 8px 20px rgba(0,0,0,.3);top:0;left:0}
.g-row.drop .g-track{background-color:var(--accent-soft)}
.g-drop{position:absolute;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--ink);z-index:5;pointer-events:none}
.btn-sm{padding:3px 9px;font-size:12.5px}
.rc-wrap{overflow-x:auto}
.rc-head,.rc-row{display:grid;grid-template-columns:minmax(150px,auto) 130px minmax(160px,1fr) 150px 150px;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:14px;min-width:720px}
.rc-head{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:600}
.rc-row:last-child{border-bottom:0}
.rc-q,.rc-t{text-align:right}
.rc-name{color:var(--muted);font-size:13.5px}
.rc-cat{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;justify-self:start;white-space:nowrap}
.rc-yari{background:var(--accent-soft);color:var(--accent)}.rc-hm{background:var(--ok-bg);color:var(--ok)}.rc-boya{background:var(--bad-bg);color:var(--bad)}
.rc-bag{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.rc-amb{background:var(--warn-bg);color:var(--warn)}.rc-etk{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}.rc-dig{background:var(--surface-2);color:var(--muted)}
details.fam>summary{cursor:pointer;list-style:none}
details.fam>summary::-webkit-details-marker{display:none}
details.fam>summary::after{content:"▾";margin-left:auto;color:var(--muted);font-size:16px}
details.fam:not([open])>summary{border-bottom:0}
.fam-toggle{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.g-bar.late{outline:2px solid var(--bad);outline-offset:-2px}
.g-bar.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:3}
.g-row.is-sel .g-label{background:var(--accent-soft)}
.g-label[data-pick]{cursor:pointer}
tr.row-sel td{background:var(--accent-soft)!important;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.g-co{position:absolute;top:15px;height:22px;background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px);border-radius:2px}
.g-now{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent);z-index:2;pointer-events:none}
.g-horizon{position:absolute;top:0;bottom:0;border-left:2px dashed var(--bad);z-index:1;pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend .sw{width:14px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

.modal-bg{position:fixed;inset:0;background:rgba(8,15,22,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h2{font-family:var(--f-display);font-size:20px;margin:0}
.modal-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 10px;width:100%}
.field textarea{min-height:140px;font-family:var(--f-mono);font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink);cursor:pointer}
.checks input{width:auto}
.err{color:var(--bad);font-size:13px}

.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:7px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.note{font-size:13px;color:var(--muted);max-width:68ch}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:25;flex-direction:row;align-items:center;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:10px;overflow:hidden}
  .brand{padding:0}.brand-sub,.side-foot,.nav-group,.nav .count{display:none}
  .brand-name{font-size:18px}
  .nav{flex-direction:row;overflow-x:auto;padding:0;gap:4px;scrollbar-width:none;min-width:0}
  .nav button{white-space:nowrap;padding:7px 10px;font-size:13.5px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--amber)}
  .top{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .settings-grid,.modal-body{grid-template-columns:minmax(0,1fr)}
  .search{width:150px}
}
@media (prefers-reduced-motion:no-preference){.g-bar{transition:filter .15s}.g-bar:hover{filter:brightness(1.1)}}

/* ---- Yönetim paneli ---- */
.dash-filters .df-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.dash-filters .field{min-width:130px;flex:1 1 140px}
.dash-filters .df-act{flex:0 0 auto;min-width:0}
.df-note{padding:0 16px 12px}
details.gaps>summary{cursor:pointer;list-style:none}
details.gaps>summary::-webkit-details-marker{display:none}
details.gaps>summary::after{content:"\25BE";margin-left:auto;color:var(--muted);font-size:16px}
details.gaps:not([open])>summary{border-bottom:0}
.gap{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 16px;border-top:1px solid var(--line)}
.gap:first-child{border-top:0}
.gap-t .hint{margin-top:2px}
.pill-info{background:var(--accent-soft);color:var(--accent)}
.kpi.is-muted .kpi-val{color:var(--muted);font-size:22px;line-height:30px}

<script>
(function(){
"use strict";
const KEY="planpres-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
const pct=v=>nf0.format(Math.round(v*100))+"%";
const nfQ=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:4});
const CATS=["Yarı mamul","Hammadde","Boya","Bağlantı elemanı","Ambalaj","Etiket","Diğer"];
const catFromText=t=>{t=String(t||"").toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ç/g,"c").replace(/ü/g,"u").replace(/ö/g,"o");
  if(/civata|somun|vida|pul\b|rondela|percin|saplama|klips|pim\b|baglanti|insert/.test(t))return"Bağlantı elemanı";
  if(/poset|koli|kutu|ambalaj|strec|bant\b|naylon|karton|palet|viyol|separat|cuval/.test(t))return"Ambalaj";
  if(/etiket|barkod/.test(t))return"Etiket";
  if(/boya|masterbatch|^mb|pigment/.test(t))return"Boya";
  if(/^hm[.\- ]|hammadde|granul|polipro|^abs|^pa6|hdpe|ldpe|polikarbonat/.test(t))return"Hammadde";
  if(/yari ?mamul|^uretim/.test(t))return"Yarı mamul";return""};
const inferCat=o=>catFromText(`${o.part||""} ${o.name||""}`)||((typeof S!=="undefined"&&S.molds.some(k=>k.part===o.part))||/-\d+$/.test(String(o.part||"").trim())?"Yarı mamul":"");
const catOf=b=>b.cat||(b.type==="Satınalma"?(inferCat(b)!=="Yarı mamul"&&inferCat(b))||"Diğer":"Yarı mamul");
const isProd=b=>catOf(b)==="Yarı mamul";
const defUnit=b=>{const c=catOf(b);return c==="Hammadde"||c==="Boya"?"kg":"adet"};
const catKey=c=>({"Yarı mamul":"yari","Hammadde":"hm","Boya":"boya","Bağlantı elemanı":"bag","Ambalaj":"amb","Etiket":"etk"})[c]||"dig";
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const parseISO=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtD=s=>{if(!s)return"–";const d=typeof s==="string"?parseISO(s):s;return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"})};
const fmtDs=d=>d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
const fmtDT=d=>d&&!isNaN(d)?d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"–";
const num=v=>{if(typeof v==="number")return v;const s=String(v??"").trim().replace(/\s/g,"").replace("%","");if(!s)return NaN;
  const t=s.includes(",")?s.replace(/\./g,"").replace(",","."):(/^-?\d{1,3}(\.\d{3})+$/.test(s)?s.replace(/\./g,""):s);return Number(t)};

function today(){return iso(new Date())}
function demo(){
  const M=(code,ton,robot)=>({id:uid(),code,ton,shifts:3,hours:7.5,eff:0.85,robot:robot?"Var":"Yok"});
  const K=(code,part,cav,cycle,partG,runnerG,mat,mb,machines,mode)=>({id:uid(),code,part,cav,cycle,partG,runnerG,mat,mb,machines:machines.split(","),mode:mode||"Otomatik"});
  const B=(product,part,qty,type)=>({id:uid(),product,part,qty,type});
  const O=(no,customer,product,qty,dueOff,extra,prio)=>{const d=new Date();d.setDate(d.getDate()+dueOff);return{id:uid(),no,customer,product,qty,due:iso(d),extra,prio}};
  return{demo:true,settings:{horizon:22,start:"",bonus:2,changeover:2,saturday:false,robotPay:1},
    machines:[M("M01",120),M("M02",150),M("M03",200,1),M("M04",250),M("M05",300,1),M("M06",350,1),M("M07",450,1),M("M08",560,1)],
    molds:[K("K-101","U100-1",4,28,18,6,"PP",.02,"M01,M02,M03"),K("K-102","U100-2",2,35,42,8,"PP",.02,"M02,M03,M04"),
      K("K-103","U200-1",1,55,320,25,"ABS",0,"M05,M06","Robotlu"),K("K-104","U200-2",8,22,6,10,"ABS",0,"M01,M02"),
      K("K-105","U300-1",2,60,610,40,"PP",.02,"M07,M08","Robotlu"),K("K-106","U300-2",4,30,35,12,"PA6",0,"M03,M04,M05","Operatörlü"),
      K("K-107","U400-1",16,18,2.5,8,"HDPE",.02,"M01,M02,M03"),K("K-108","U400-2",1,75,1150,60,"PP",0,"M08","Robotlu"),
      K("K-109","U500-1",2,45,140,18,"ABS",0,"M04,M05,M06","Robotlu"),K("K-110","U500-2",4,25,22,9,"PP",.02,"M01,M02,M03"),
      K("K-111","U600-1",2,40,95,14,"PA6",0,"M04,M05,M06"),K("K-112","U600-2",8,20,4,7,"HDPE",.02,"M02,M03")],
    bom:[B("U100","U100-1",1,"Üretim"),B("U100","U100-2",2,"Üretim"),B("U100","VIDA-M4",4,"Satınalma"),
      B("U200","U200-1",1,"Üretim"),B("U200","U200-2",4,"Üretim"),B("U200","ETIKET-01",1,"Satınalma"),
      B("U300","U300-1",1,"Üretim"),B("U300","U300-2",2,"Üretim"),B("U400","U400-1",6,"Üretim"),B("U400","U400-2",1,"Üretim"),
      B("U500","U500-1",1,"Üretim"),B("U500","U500-2",2,"Üretim"),B("U500","VIDA-M4",2,"Satınalma"),
      B("U600","U600-1",1,"Üretim"),B("U600","U600-2",4,"Üretim"),
      ...["U100","U200","U300","U400","U500","U600"].flatMap(p=>[
        {id:uid(),product:p,part:"POSET-20x30",name:"Poşet 20x30",cat:"Ambalaj",qty:1,unit:"adet",scrap:.02},
        {id:uid(),product:p,part:"KOLI-40",name:"Koli 40x30x30 (50'li)",cat:"Ambalaj",qty:.02,unit:"adet"},
        {id:uid(),product:p,part:"ETIKET-KOLI",name:"Koli etiketi",cat:"Etiket",qty:.02,unit:"adet"}]),
      {id:uid(),product:"U300",part:"CIVATA-M5x16",name:"Cıvata M5x16",cat:"Bağlantı elemanı",qty:2,unit:"adet",scrap:.01},
      {id:uid(),product:"U300",part:"SOMUN-M5",name:"Somun M5",cat:"Bağlantı elemanı",qty:2,unit:"adet",scrap:.01}],
    orders:[O("SP-001","Müşteri A","U100",12000,25,.10,1),O("SP-002","Müşteri B","U200",4000,20,0,1),
      O("SP-003","Müşteri C","U100",10000,41,.05,2),O("SP-004","Müşteri A","U300",6000,35,.15,2),
      O("SP-005","Müşteri D","U400",9000,30,0,1),O("SP-006","Müşteri B","U300",5000,50,.10,3),
      O("SP-007","Müşteri E","U500",18000,38,.05,2),O("SP-008","Müşteri C","U600",14000,45,0,2),
      O("SP-009","Müşteri D","U200",3000,52,0,3)],
    materials:[
      {id:uid(),code:"PP",name:"Polipropilen homopolimer",mtype:"Hammadde",stock:15000,incoming:8000,incomingDate:"",lead:10,safety:2000,moq:5000},
      {id:uid(),code:"ABS",name:"ABS genel amaçlı",mtype:"Hammadde",stock:8000,incoming:0,incomingDate:"",lead:7,safety:500,moq:1000},
      {id:uid(),code:"PA6",name:"Poliamid 6",mtype:"Hammadde",stock:1200,incoming:1500,incomingDate:(()=>{const d=new Date();d.setDate(d.getDate()+6);return iso(d)})(),lead:14,safety:300,moq:1000},
      {id:uid(),code:"HDPE",name:"Yüksek yoğunluklu PE",mtype:"Hammadde",stock:900,incoming:0,incomingDate:"",lead:7,safety:200,moq:500},
      {id:uid(),code:"VIDA-M4",name:"M4 vida",mtype:"Bağlantı elemanı",stock:150000,incoming:0,incomingDate:"",lead:10,safety:10000,moq:0},
      {id:uid(),code:"ETIKET-01",name:"Ürün etiketi",mtype:"Etiket",stock:3000,incoming:0,incomingDate:"",lead:3,safety:500,moq:5000},
      {id:uid(),code:"POSET-20x30",name:"Poşet 20x30",mtype:"Ambalaj",stock:40000,incoming:0,incomingDate:"",lead:7,safety:5000,moq:10000},
      {id:uid(),code:"KOLI-40",name:"Koli 40x30x30",mtype:"Ambalaj",stock:300,incoming:500,incomingDate:"",lead:5,safety:100,moq:500},
      {id:uid(),code:"CIVATA-M5x16",name:"Cıvata M5x16",mtype:"Bağlantı elemanı",stock:30000,incoming:0,incomingDate:"",lead:10,safety:5000,moq:10000}],
    overrides:{}};
}
let S;
function load(){try{const t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);return}}catch(e){}S=demo()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------- planning engine ---------- */
const netHours=m=>(+m.shifts||0)*(+m.hours||0)*(+m.eff||0);
const hasRobot=m=>!!m&&(m.robot===true||m.robot==="Var");
function workDays(start,count,sat){const out=[];const d=parseISO(start);while(out.length<count){const w=d.getDay();if(w!==0&&(sat||w!==6))out.push(new Date(d));d.setDate(d.getDate()+1)}return out}
function compute(){
  const st=S.settings, start=st.start||today();
  const mbr=k=>(+k.mb>0)?+k.mb:(String(k.mbCode||"").trim()?(st.mbDefault==null?0.02:+st.mbDefault):0);
  const prod={};const excl=String(st.exclude||"").split(/[,;\s]+/).filter(Boolean).map(x=>x.toUpperCase());
  for(const o of S.orders){if(excl.some(p=>String(o.product).toUpperCase().startsWith(p)))continue;
    const q=Math.ceil((+o.qty||0)*(1+(+o.extra||0)));if(!prod[o.product])prod[o.product]={gross:0,qty:0,due:null,stock:0};const P=prod[o.product];P.gross+=q;
    if(o.stock!==""&&o.stock!=null)P.stock=Math.max(P.stock,+o.stock||0);
    if(o.due&&(!P.due||o.due<P.due))P.due=o.due;
    (P.lots=P.lots||[]).push({due:o.due||null,qty:q,no:o.no||"",prio:o.prio})}
  for(const P of Object.values(prod)){P.qty=st.useStock===false?P.gross:Math.max(0,P.gross-P.stock);
    // sipariş bazında talep: eldeki stok önce en erken terminli siparişten düşülür
    P.lots.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));let left=st.useStock===false?0:P.stock;
    for(const l of P.lots){const u=Math.min(left,l.qty);l.qty-=u;left-=u}P.lots=P.lots.filter(l=>l.qty>0)}
  // multi-level recipe explosion: semi-finished parts go to molding (or further down), everything else is bought
  const parts={},buy={},bomBy={};S.bom.forEach(b=>{(bomBy[b.product]=bomBy[b.product]||[]).push(b)});
  const molded=new Set(S.molds.map(k=>k.part));
  const put=(tgt,b,n,due,root,lot)=>{const e=tgt[b.part]=tgt[b.part]||{need:0,due:null,products:new Set(),byProd:{},cat:catOf(b),unit:b.unit||defUnit(b),name:b.name||"",lots:[]};
    e.need+=n;e.products.add(root);e.byProd[root]=(e.byProd[root]||0)+n;if(due&&(!e.due||due<e.due))e.due=due;
    if(lot)e.lots.push({due,n,root,no:lot.no,prio:lot.prio})};
  const explode=(pc,qty,due,root,depth,lot)=>{for(const b of bomBy[pc]||[]){const n=qty*(+b.qty||0)*(1+(+b.scrap||0));if(!(n>0))continue;
    if(isProd(b)){if(molded.has(b.part)||!bomBy[b.part])put(parts,b,n,due,root,lot);if(bomBy[b.part]&&depth<6)explode(b.part,n,due,root,depth+1,lot)}
    else put(buy,b,n,due,root,lot)}};
  for(const [pc,p] of Object.entries(prod)){if(p.qty&&bomBy[pc])for(const l of p.lots)explode(pc,l.qty,l.due,pc,0,l)}
  const bomProducts=new Set(S.bom.map(b=>b.product));const unmatched=[];let autoLinked=0;
  const addPart=(pc,part,n,due,lot)=>{if(!parts[part])parts[part]={need:0,due:null,products:new Set(),lots:[]};parts[part].need+=n;parts[part].products.add(pc);if(due&&(!parts[part].due||due<parts[part].due))parts[part].due=due;
    if(lot)parts[part].lots.push({due,n,root:pc,no:lot.no,prio:lot.prio})};
  const addLots=(pc,part,p)=>p.lots.forEach(l=>addPart(pc,part,l.qty,l.due,l));
  for(const [pc,p] of Object.entries(prod)){if(bomProducts.has(pc)||!p.qty)continue;
    if(S.molds.some(k=>k.part===pc)){addLots(pc,pc,p);continue}
    if(st.autoBom!==false){const re=new RegExp("^"+String(pc).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"-\\d+$");const subs=[...new Set(S.molds.filter(k=>re.test(k.part)).map(k=>k.part))];
      if(subs.length){subs.forEach(s=>addLots(pc,s,p));autoLinked++;continue}}
    unmatched.push(pc)}
  const mByCode={};S.machines.forEach(m=>mByCode[m.code]=m);
  const jobs=[];const missing=[];
  // sipariş bazında işler: aynı parçanın terminleri birbirine yakın (st.batchDays gün) siparişleri tek işte toplanır,
  // uzak terminliler ayrı iş olur. batchDays=0 ya da aile kalıbı: eski davranış (parçanın tüm ihtiyacı tek iş).
  const batchDays=st.batchDays==null||st.batchDays===""?7:+st.batchDays,famSet=S.family||{};
  const dayDiff=(a,b)=>(parseISO(b)-parseISO(a))/864e5;
  const groupLots=(v,mold)=>{const L=(v.lots||[]).slice();
    if(!(batchDays>0)||famSet[String(mold.code)]||L.length<2)return[{need:v.need,due:v.due,products:[...v.products],orders:[...new Set(L.map(l=>l.no).filter(Boolean))]}];
    L.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));const gs=[];let g=null;
    for(const l of L){if(!g||(g.due&&!l.due)||(g.due&&l.due&&dayDiff(g.due,l.due)>batchDays)||(!g.due&&l.due)){g={need:0,due:l.due||null,products:new Set(),orders:new Set()};gs.push(g)}
      g.need+=l.n;g.products.add(l.root);if(l.no)g.orders.add(l.no)}
    return gs.map(x=>({need:x.need,due:x.due,products:[...x.products],orders:[...x.orders]}))};
  for(const [part,v] of Object.entries(parts)){
    const mold=S.molds.find(k=>k.part===part);
    if(!mold){missing.push(part);continue}
    const rate=(+mold.cycle>0)?3600/(+mold.cycle)*(+mold.cav||1):0;
    const gPer=(+mold.partG||0)+(+mold.runnerG||0)/(+mold.cav||1);
    groupLots(v,mold).forEach((g,gi)=>{
      const hrs=rate?g.need/rate:0,kg=g.need*gPer/1000;
      jobs.push({part,key:gi?part+"@"+(g.due||"termsiz"):part,batch:gi,mold,need:g.need,due:g.due,products:g.products,orders:g.orders,rate,hrs,mat:mold.mat,kgMain:kg*(1-mbr(mold)),kgMb:kg*mbr(mold),needR:mold.mode==="Robotlu",listed:(mold.machines||[]).filter(c=>mByCode[c])});
      const jj=jobs[jobs.length-1];jj.compat=jj.listed.filter(c=>!jj.needR||hasRobot(mByCode[c]))});
  }
  // family molds: parts from one mold are pressed together as one job
  const fam=S.family||{};const byCode={};jobs.forEach(j=>{const c=String(j.mold.code);if(fam[c])(byCode[c]=byCode[c]||[]).push(j)});
  for(const [c,g] of Object.entries(byCode)){if(g.length<2)continue;const f=g[0];

$("#planBtn").addEventListener("click",()=>{const r=compute();const late=r.jobs.filter(j=>j.level!=="ok").length;

  const avg=used.length?used.reduce((a,m)=>a+m._util,0)/used.length:0;
  const risk=R.jobs.filter(j=>j.level!=="ok");
  const hrs=R.jobs.reduce((a,j)=>a+j.hrs,0);
  const over=S.machines.filter(m=>m._util>1).length;
  $("#view").innerHTML=`
  <section class="kpis">
    <div class="kpi"><span class="kpi-label">Açık sipariş</span><span class="kpi-val">${S.orders.length}</span><span class="kpi-foot">${nf0.format(tot)} adet mamul</span></div>
    <div class="kpi"><span class="kpi-label">Üretilecek parça</span><span class="kpi-val">${R.jobs.length}</span><span class="kpi-foot">${Object.keys(R.buy).length} kalem satınalma</span></div>
    <div class="kpi"><span class="kpi-label">Makine saati</span><span class="kpi-val">${nf0.format(hrs)}</span><span class="kpi-foot">${H} iş günü ufukta</span></div>
    <div class="kpi"><span class="kpi-label">Ortalama doluluk</span><span class="kpi-val">${pct(avg)}</span><span class="kpi-foot">${over?`${over} makine ufku aşıyor`:"Ufku aşan makine yok"}</span></div>
    <div class="kpi ${risk.length?"is-bad":""}"><span class="kpi-label">Uyarı</span><span class="kpi-val">${risk.length}</span><span class="kpi-foot">${risk.length?"Gecikme veya makine sorunu":"Tüm işler termine yetişiyor"}</span></div>
    <div class="kpi ${R.mrp.late?"is-bad":""}"><span class="kpi-label">Malzeme</span><span class="kpi-val">${R.mrp.toOrder}</span><span class="kpi-foot">${R.mrp.toOrder?`kalem sipariş gerekiyor${R.mrp.late?`, ${R.mrp.late} acil`:""}`:"Eksik malzeme yok"}</span></div>
  </section>
  <section class="grid-2">
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Makine doluluğu</h2><span class="panel-sub">${H} iş günlük plan ufkuna göre · kesik çizgi %85</span></div>
      <div class="panel-body"><div class="load-list">${S.machines.map(m=>{const u=m._util,c=u>1?"var(--bad)":u>.85?"var(--warn)":"var(--ok)";
        return`<div class="load-row"><span class="code">${esc(m.code)}</span><div class="load-bar" title="${nf1.format(m._days)} gün"><span style="width:${Math.min(100,u*100)}%;background:${c}"></span><i class="limit"></i></div><span class="num" style="text-align:right">${pct(u)}</span></div>`}).join("")}</div></div></div>
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Dikkat gerektirenler</h2></div>
      ${risk.length?`<div class="tbl-wrap"><table><thead><tr><th>Parça</th><th>Makine</th><th>Termin</th><th>Durum</th></tr></thead><tbody>${risk.map(j=>`<tr><td class="code">${esc(j.part)}</td><td class="code">${esc(j.machine||"–")}</td><td class="num">${fmtD(j.due)}</td><td>${pill(j.level,j.status)}</td></tr>`).join("")}</tbody></table></div>`
      :`<div class="empty">Uyarı yok. Tüm parçalar uygun makinede ve termine yetişiyor.</div>`}
      ${R.missing.length?`<div class="panel-body err">Kalıbı tanımlı olmayan parçalar: ${R.missing.map(esc).join(", ")}</div>`:""}
      ${R.unmatched.length?`<div class="panel-body err">Ürün ağacı ve kalıbı bulunamayan mamuller (${R.unmatched.length}): ${R.unmatched.slice(0,40).map(esc).join(", ")}${R.unmatched.length>40?" …":""}</div>`:""}
      ${R.waits.length?`<div class="panel-body hint">Kalıp çakışması nedeniyle ertelenen işler (${R.waits.length}): ${R.waits.slice(0,12).map(s=>`${esc(s.part)} (${esc(s.mold.code)} kalıbı ${esc(s.waitBy)}'de, ${nf1.format(s.wait)} sa)`).join(", ")}${R.waits.length>12?" …":""}</div>`:""}

  $("#view").querySelector("[data-go]").onclick=()=>go("mrp");
}

  <div class="panel"><div class="panel-head"><div><h2 class="panel-title">Parça bazlı plan</h2><div class="panel-sub">Öneri motoru uygun makineler içinde önce aynı hammaddeyi çalıştıranı, sonra en az yüklüsünü seçer. Beğenmediğiniz satırda makineyi elle değiştirin.</div></div></div>

      <option value="">Öneriyi kullan</option>${opts.map(c=>`<option value="${esc(c)}" ${j.override&&j.machine===c?"selected":""}>${esc(c)}${j.compat.includes(c)?"":(j.needR&&j.listed.includes(c)?" (robot yok)":" (uyumsuz)")}</option>`).join("")}</select>`}</td>
    <td class="num">${fmtDT(j.startDT)}</td><td class="num">${fmtDT(j.end)}</td><td>${pill(j.level,j.status)}${shortPill(j)}</td></tr>`).join("")||`<tr><td colspan="12" class="empty">Plan için sipariş ve ürün ağacı gerekli.</td></tr>`}
  </tbody></table></div></div>`;
  $("#view").querySelectorAll("select[data-part]").forEach(s=>s.onchange=()=>{const p=s.dataset.part;if(s.value)S.overrides[p]=s.value;else delete S.overrides[p];save();render();toast(s.value?`${p} → ${s.value}`:`${p} öneriye döndü`)});
}

function vTakvim(R){
  const Z={hafta:40,gun:150,vardiya:420};if(!Z[ui.zoom])ui.zoom="gun";
  const DW=Z[ui.zoom],H=+S.settings.horizon||22,co=+S.settings.changeover||0;
  if(!S.machines.some(m=>m.code===ui.selM))ui.selM=(S.machines.find(m=>(R.lanes[m.code]||[]).length)||S.machines[0]||{}).code;
  const days=R.days.slice(0,R.span);
  const tIso=today();
  const mats=[...new Set(R.jobs.map(j=>j.mat))];
  const head=`<div class="g-head"><div class="g-label">Makine</div><div class="g-days">${days.map(d=>`<div class="g-day ${iso(d)===tIso?"today":""}" style="width:${DW}px"><b>${fmtDs(d)}</b>${d.toLocaleDateString("tr-TR",{weekday:"short"})}</div>`).join("")}</div></div>`;
  const rows=S.machines.map(m=>{const n=netHours(m);const lane=R.lanes[m.code]||[];let px=0;
    const bars=lane.map((j,ix)=>{let out="";
      if(j.wait>0.05&&j.L){const wx=Math.max(((j.coA??j.startA)-j.wait/j.L)*DW,px),ww=j.wait/j.L*DW;out+=`<div class="g-wait" style="left:${wx}px;width:${ww}px" title="Kalıp ${esc(j.waitBy||"")} makinesinde, boşalması bekleniyor"></div>`;px=wx+ww}
      if(j.coA!=null&&j.L){const cx=Math.max(j.coA*DW,px),cw=Math.max(3,co/j.L*DW);out+=`<div class="g-co" style="left:${cx}px;width:${cw}px" title="Kalıp değişimi"></div>`;px=cx+cw+1}
      const x=Math.max(j.startA!=null?j.startA*DW:0,px),w=Math.max(8,j.startA!=null?(j.endA-j.startA)*DW:8);px=x+w+1;
      const sel=ui.selM===m.code&&ui.selJob===j.key;
      out+=`<button type="button" class="g-bar ${j.level==="warn"?"late":""} ${sel?"sel":""} ${j.running?"run":""} ${j.matShort?"short":""}" data-m="${esc(m.code)}" data-j="${esc(j.key)}" data-sid="${esc(j.sid)}" style="left:${x}px;width:${w}px;background:${matColor(j.mat)}" title="${ix+1}. ${esc(j.part)}${j.segNo===1?" (1. kısım)":j.segNo===2?" (devam)":""} · ${esc(j.mold.code)} · ${esc(j.mat)}\n${nf0.format(j.need)} adet ÷ ${esc(j.mold.cav)} göz × ${esc(j.mold.cycle)} sn = ${nf1.format(j.hrs)} saat baskı\nBaşlangıç ${fmtDT(j.startDT)} · Bitiş ${fmtDT(j.end)}\nTermin ${fmtD(j.due)}${j.running?"\nMakinede şu an çalışıyor (sabit)":"\nSürükleyip başka yere bırakabilirsiniz"}${j.wait>0.05?`\nKalıp ${esc(j.waitBy)} makinesinde olduğu için ${nf1.format(j.wait)} saat bekliyor`:""}">${w>=44?(j.running&&j.segNo!==2?"▶ ":"")+esc(j.part)+(j.segNo===2?" ↻":""):""}${w>=70?`<small>${nf0.format(j.need)} ad</small>`:""}</button>`;
      return out}).join("");
    return`<div class="g-row ${ui.selM===m.code?"is-sel":""}" data-row="${esc(m.code)}"><div class="g-label" data-pick="${esc(m.code)}" role="button" tabindex="0"><b>${esc(m.code)}</b><span>${esc(m.ton)} ton${hasRobot(m)?" · robot":""} · ${pct(m._util)}</span></div><div class="g-track" style="width:${days.length*DW}px;background-size:${DW}px 100%">${bars}${R.span>H?`<div class="g-horizon" style="left:${H*DW}px" title="Plan ufku"></div>`:""}${!S.settings.start&&m._off?`<div class="g-now" style="left:${m._off*DW}px" title="Şimdi"></div>`:""}</div></div>`}).join("");
  $("#view").innerHTML=`
  <div class="panel"><div class="panel-head"><div><h2 class="panel-title">Makine takvimi</h2><div class="panel-sub">Başlangıç ${fmtD(R.start)} · taralı alan kalıp değişimi · işi sürükleyip başka sıraya ya da makineye bırakın · tıklayınca sırası aşağıda açılır</div></div>
    <div class="toolbar">${(Object.keys(S.overrides||{}).length||Object.keys(S.seq||{}).length||Object.keys(S.splits||{}).length)?`<span id="resetWrap"><button class="btn" type="button" id="resetMan">Elle düzenlemeleri sıfırla</button></span>`:""}<div class="seg" role="group" aria-label="Yakınlaştırma">${[["hafta","Hafta"],["gun","Gün"],["vardiya","Vardiya"]].map(([k,t])=>`<button type="button" data-z="${k}" aria-pressed="${ui.zoom===k}">${t}</button>`).join("")}</div></div></div>
  <div class="panel-body legend" style="padding-block:10px">${mats.map(m=>`<span><i class="sw" style="background:${matColor(m)}"></i>${esc(m)}</span>`).join("")}<span><i class="sw" style="outline:2px solid var(--bad);background:transparent"></i>Gecikme riski</span></div>
  <div class="gantt-wrap" id="gwrap"><div class="gantt">${head}${rows}</div></div></div>
  <div class="panel" id="seqPanel"></div>`;
  const drawSeq=()=>{const m=S.machines.find(x=>x.code===ui.selM);const p=$("#seqPanel");if(!m){p.innerHTML=`<div class="empty">Makine yok.</div>`;return}
    const n=netHours(m),lane=R.lanes[m.code]||[];const dayAt=h=>R.days[Math.min(R.days.length-1,Math.max(0,Math.floor(h/(n||1))))];
    p.innerHTML=`<div class="panel-head"><div><h2 class="panel-title">${esc(m.code)} iş sırası</h2><div class="panel-sub">${esc(m.ton)} ton${hasRobot(m)?" · robotlu":""} · ${lane.length} iş · ${nf1.format(m._load||0)} saat · doluluk ${pct(m._util||0)}</div></div>
      <div class="toolbar"><label class="hint" for="seqM">Makine</label><select id="seqM" class="sel">${S.machines.map(x=>`<option ${x.code===m.code?"selected":""}>${esc(x.code)}</option>`).join("")}</select></div></div>
      <div class="panel-body run-edit"><span class="run-label">Şu an çalışan iş</span>
        <input id="rp" class="sel" list="rpl" value="${esc(m.rPart||"")}" placeholder="Parça kodu" aria-label="Çalışan parça kodu" autocomplete="off" style="width:130px"><datalist id="rpl">${S.molds.filter(k=>(k.machines||[]).includes(m.code)).map(k=>`<option value="${esc(k.part)}">`).join("")}</datalist>
        <input id="rr" class="sel" inputmode="numeric" value="${esc(m.rRemain??"")}" placeholder="Kalan adet" aria-label="Kalan adet" style="width:110px">
        <button class="btn btn-sm btn-primary" id="rsave" type="button">Kaydet</button>${m.rPart?`<button class="btn btn-sm" id="rclear" type="button">Makine boş</button>`:""}
        <span class="hint">Çalışan iş planın başına sabitlenir. Kalan adet boşsa parçanın tüm ihtiyacı alınır.</span></div>
      <div class="tbl-wrap"><table><thead><tr><th class="r">#</th><th>Parça</th><th>Kalıp</th><th>Hammadde</th><th>Çalışma</th><th class="r">Adet</th><th class="r">Saat</th><th>Başlangıç</th><th>Bitiş</th><th>Termin</th><th>Durum</th><th></th></tr></thead><tbody>
      ${lane.map((j,i)=>`<tr class="${ui.selJob===j.key?"row-sel":""}" data-j="${esc(j.key)}"><td class="r num">${i+1}</td><td class="code">${esc(j.part)}${j.running&&j.segNo!==2?' <span class="mchip run-chip">▶ çalışıyor</span>':""}${j.segNo?` <span class="mchip">${j.segNo===1?"1. kısım":"devam"}</span>`:""}</td><td class="code">${esc(j.mold.code)}</td><td>${matTag(j.mat)}</td><td>${modeTag(j.mold.mode)}</td><td class="r num">${needTxt(j)}</td><td class="r num">${nf1.format(j.hrs)}</td><td class="num">${fmtDT(j.startDT)}</td><td class="num">${fmtDT(j.end)}</td><td class="num">${fmtD(j.due)}</td><td>${pill(j.level,j.status)}${shortPill(j)}${j.wait>0.05?`<div class="hint">Kalıp ${esc(j.waitBy)}'de, ${nf1.format(j.wait)} sa bekliyor</div>`:""}</td><td>${j.segNo===0?`<button class="btn btn-sm" type="button" data-split="${esc(j.key)}">Araya iş al</button>`:j.segNo===1?`<button class="btn btn-sm" type="button" data-merge="${esc(j.key)}">Birleştir</button>`:""}</td></tr>`).join("")||`<tr><td colspan="12" class="empty">Bu makineye atanmış iş yok.</td></tr>`}
      </tbody></table></div>`;
    $("#seqM").onchange=e=>{ui.selM=e.target.value;ui.selJob=null;vTakvim(R)};
    $("#rsave").onclick=()=>{const part=$("#rp").value.trim();const rr=$("#rr").value.trim();
      if(part&&!S.molds.some(k=>k.part===part)){toast(`${part} için kalıp kaydı yok. Önce Kalıplar'a ekleyin.`);return}
      const q=rr===""?"":Math.round(num(rr));if(rr!==""&&!(q>0)){toast("Kalan adet pozitif bir sayı olmalı");return}
      if(part&&S.machines.some(x=>x!==m&&x.rPart===part))toast(`Uyarı: ${part} başka bir makinede de çalışıyor görünüyor`);
      m.rPart=part;m.rRemain=part?q:"";if(S.splits)delete S.splits["RUN:"+m.code];save();render();toast(part?`${m.code}: ${part} çalışıyor olarak kaydedildi`:`${m.code} boş olarak kaydedildi`)};
    const rc=$("#rclear");if(rc)rc.onclick=()=>{m.rPart="";m.rRemain="";if(S.splits)delete S.splits["RUN:"+m.code];save();render();toast(`${m.code} boş olarak kaydedildi`)};
    p.querySelectorAll("[data-split]").forEach(b=>b.onclick=()=>openSplit(R,m.code,b.dataset.split));
    p.querySelectorAll("[data-merge]").forEach(b=>b.onclick=()=>{const part=b.dataset.merge;delete S.splits[part];
      for(const k of Object.keys(S.seq||{})){const L=S.seq[k];const i=L.indexOf(part+"#1");if(i>=0)L[i]=part;S.seq[k]=L.filter(x=>x!==part+"#2"&&x!==part+"#1")}
      save();render();toast("Bölünmüş iş birleştirildi")});
    const sr=p.querySelector("tr.row-sel");if(sr&&ui._scrollSeq){sr.scrollIntoView({block:"nearest"});ui._scrollSeq=false}};
  drawSeq();
  const v=$("#view");
  v.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{ui.zoom=b.dataset.z;vTakvim(R)});
  const keepX=fn=>{const sx=$("#gwrap").scrollLeft;fn();const g=$("#gwrap");if(g)g.scrollLeft=sx};
  const rm=$("#resetMan");if(rm)rm.onclick=()=>{$("#resetWrap").innerHTML=`<span class="hint">Tüm elle makine, sıra ve bölme değişiklikleri silinsin mi?</span> <button class="btn btn-danger" type="button" id="resetMan2">Evet, sıfırla</button>`;
    $("#resetMan2").onclick=()=>{S.overrides={};S.seq={};S.splits={};save();render();toast("Plan otomatik sıraya döndü")}};
  let drag=null;
  const clearDrop=()=>{v.querySelectorAll(".g-row.drop").forEach(r=>r.classList.remove("drop"));v.querySelectorAll(".g-drop").forEach(x=>x.remove())};
  const dropIndex=(tr,rx,sid)=>{const bs=[...tr.querySelectorAll(".g-bar")].filter(b=>b.dataset.sid!==sid);let i=0;for(const b of bs){if(b.offsetLeft+b.offsetWidth/2<rx)i++}return{i,bs}};
  v.querySelectorAll(".g-bar").forEach(b=>{
    b.onpointerdown=e=>{if(e.button>0)return;drag={b,sid:b.dataset.sid,part:b.dataset.j,from:b.dataset.m,x0:e.clientX,y0:e.clientY,moved:false,locked:b.classList.contains("run")};try{b.setPointerCapture(e.pointerId)}catch(_){}};

      if(!drag.moved){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;drag.moved=true;
        const g=b.cloneNode(true);g.classList.add("ghost");g.classList.remove("sel");g.style.width=Math.max(60,b.offsetWidth)+"px";g.innerHTML=esc(drag.part);document.body.append(g);drag.ghost=g;b.classList.add("dragging")}
      drag.ghost.style.left=(e.clientX+8)+"px";drag.ghost.style.top=(e.clientY-17)+"px";
      const el=document.elementFromPoint(e.clientX,e.clientY);const row=el&&el.closest(".g-row[data-row]");clearDrop();drag.to=null;
      if(row){const tr=row.querySelector(".g-track");row.classList.add("drop");const rx=e.clientX-tr.getBoundingClientRect().left;const {i,bs}=dropIndex(tr,rx,drag.sid);
        drag.to=row.dataset.row;drag.idx=i;const mk=document.createElement("div");mk.className="g-drop";
        mk.style.left=(bs.length?(i<bs.length?bs[i].offsetLeft-3:bs[bs.length-1].offsetLeft+bs[bs.length-1].offsetWidth+1):2)+"px";tr.append(mk)}};
    const end=e=>{if(!drag||drag.b!==b)return;const d=drag;drag=null;if(d.ghost)d.ghost.remove();b.classList.remove("dragging");clearDrop();

function openSplit(R,mc,part){
  const lane=R.lanes[mc]||[];const cur=lane.find(s=>s.sid===part);if(!cur)return;
  const others=R.jobs.filter(j=>!j.running&&j.key!==part&&j.part!==cur.part).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  modal(`${cur.part} işini durdur, araya iş al`,`<form id="spf" class="modal-body">
    <div class="field full"><span class="hint">${esc(mc)} makinesindeki ${esc(cur.part)} (${nf0.format(cur.need)} adet) ikiye bölünür. Seçtiğiniz iş araya girer, kalan adet onun arkasından devam eder. Araya kalıp değişimi süreleri otomatik eklenir.</span></div>
    <div class="field"><label for="sp-q">Durdurmadan önce basılacak adet</label><input id="sp-q" name="q" inputmode="numeric" value="${Math.round(cur.need/2)}"><span class="hint">Örn. şu ana kadar basılan + bitirilmesi gereken kısım</span></div>
    <div class="field"><label for="sp-j">Araya alınacak iş</label><select id="sp-j" name="j">${others.map(j=>`<option value="${esc(j.key)}">${esc(j.part)} · ${esc(j.machine||"atanmadı")} · termin ${fmtD(j.due)}${j.compat.includes(mc)?"":" · uyumsuz"}</option>`).join("")}</select><span class="hint">Listede yoksa önce Siparişler'e acil siparişi ekleyin</span></div>
    <div class="field full err" id="sperr" hidden></div></form>`,
    `<button class="btn btn-primary" type="submit" form="spf">Durdur ve araya al</button><button class="btn" type="button" id="spc">Vazgeç</button>`);
  $("#spc").onclick=closeModal;
  $("#spf").onsubmit=e=>{e.preventDefault();const q=Math.round(num($("#sp-q").value));const u=$("#sp-j").value;const err=$("#sperr");
    if(!(q>0&&q<cur.need)){err.hidden=false;err.textContent=`Adet 1 ile ${nf0.format(cur.need-1)} arasında olmalı`;return}
    if(!u){err.hidden=false;err.textContent="Araya alınacak bir iş seçin";return}
    S.splits=S.splits||{};S.seq=S.seq||{};S.splits[part]=q;
    const uj=R.jobs.find(j=>j.key===u);
    if(uj&&uj.machine&&uj.machine!==mc&&S.seq[uj.machine])S.seq[uj.machine]=S.seq[uj.machine].filter(id=>id!==u&&!id.startsWith(u+"#"));
    if(uj&&uj.machine&&uj.machine!==mc){S.seq[uj.machine]=(R.lanes[uj.machine]||[]).map(s=>s.sid).filter(id=>id!==u&&!id.startsWith(u+"#"))}
    S.overrides[u]=mc;const ids=lane.map(s=>s.sid).filter(id=>id!==u&&!id.startsWith(u+"#"));const at=ids.indexOf(part);
    ids.splice(at,1,part+"#1",u,part+"#2");S.seq[mc]=ids;
    ui.selM=mc;ui.selJob=u;save();closeModal();render();toast(`${cur.part} ${nf0.format(q)} adette durdu, araya ${u} alındı`)};
}

/* ==================== YÖNETİM PANELİ · analiz modülleri ====================
   Saf fonksiyonlar: yalnızca S (kayıtlar) ve R (compute() sonucu) okur, hiçbir şey yazmaz.
   Eksik veri asla 0 ya da tahminle doldurulmaz: hesaplanamayan değer null döner. */
const Dash={
  parseF(F){F=F||{};return{from:F.from||"",to:F.to||"",machine:F.machine||"",product:String(F.product||"").trim()}},
  inRange(d,f){if(!f.from&&!f.to)return true;if(!d)return false;d=String(d).slice(0,10);return(!f.from||d>=f.from)&&(!f.to||d<=f.to)},
  prodMatch(code,p){if(!p)return true;code=String(code||"").trim();return code===p||(p.endsWith("-")&&code.startsWith(p))},
  // parça -> hangi mamullerde kullanıldığı (plan + çok seviyeli reçete)
  partProducts(S,R){const m={};const add=(part,p)=>{(m[part]=m[part]||new Set()).add(p)};
    (R.jobs||[]).forEach(j=>(j.members||[{part:j.part}]).forEach(x=>(j.products||[]).forEach(p=>add(x.part,p))));
    const by={};S.bom.forEach(b=>{(by[b.part]=by[b.part]||[]).push(b.product)});
    const up=(part,seen)=>{const out=new Set();for(const p of by[part]||[]){if(seen.has(p))continue;seen.add(p);out.add(p);up(p,seen).forEach(x=>out.add(x))}return out};
    Object.keys(by).forEach(part=>up(part,new Set()).forEach(p=>add(part,p)));return m},
  partMatch(pp,part,p){if(!p)return true;if(Dash.prodMatch(part,p))return true;const s=pp[part];if(s)for(const x of s)if(Dash.prodMatch(x,p))return true;
    const base=String(part||"").replace(/-\d+$/,"");return base!==part&&Dash.prodMatch(base,p)},
  dueEst(o,lead){if(o.dueEst)return true;if(!o.orderDate||!o.due)return false;return Math.round((parseISO(o.due)-parseISO(o.orderDate))/864e5)===lead},
  weekStart(d){const x=parseISO(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x)},
  workdays(from,to,sat){let n=0;const d=parseISO(from),e=parseISO(to);while(d<=e){const w=d.getDay();if(w!==0&&(sat||w!==6))n++;d.setDate(d.getDate()+1)}return n},

  /* açık siparişler: miktar, termin haftası, yaşlanma, mamul bazında net ihtiyaç */
  orders(S,f,t0){const lead=S.settings.leadDays==null?30:+S.settings.leadDays;
    const L=S.orders.filter(o=>Dash.prodMatch(o.product,f.product)&&Dash.inRange(o.due,f));
    const byP={},byW={},cust=new Set();let qty=0,est=0,overdue=0,overQty=0,agingN=0;const aging={"0–30 gün":0,"31–60 gün":0,"61–90 gün":0,"90+ gün":0};
    for(const o of L){const q=+o.qty||0;qty+=q;if(o.customer)cust.add(String(o.customer).trim());if(Dash.dueEst(o,lead))est++;
      const P=byP[o.product]=byP[o.product]||{code:o.product,qty:0,lines:0,stock:null,oldest:null,due:null};P.qty+=q;P.lines++;
      if(o.stock!==""&&o.stock!=null&&!isNaN(+o.stock))P.stock=Math.max(P.stock??0,+o.stock);
      if(o.orderDate&&(!P.oldest||o.orderDate<P.oldest))P.oldest=o.orderDate;if(o.due&&(!P.due||o.due<P.due))P.due=o.due;
      const late=!!o.due&&o.due<t0;if(late){overdue++;overQty+=q}
      const wk=!o.due?"none":late?"late":Dash.weekStart(o.due);byW[wk]=(byW[wk]||0)+q;
      if(o.orderDate){agingN++;const a=Math.floor((parseISO(t0)-parseISO(o.orderDate))/864e5);aging[a<=30?"0–30 gün":a<=60?"31–60 gün":a<=90?"61–90 gün":"90+ gün"]+=q}}
    const prods=Object.values(byP).map(p=>({...p,net:p.stock==null?null:Math.max(0,p.qty-p.stock)}));
    const net=prods.reduce((a,p)=>a+(p.net??0),0),netUnknown=prods.filter(p=>p.net==null).length;
    const weeks=Object.keys(byW).filter(k=>k!=="late"&&k!=="none").sort();
    const buckets=[...(byW.late?[{key:"late",label:"Gecikmiş",short:"Gecikmiş",qty:byW.late,late:true}]:[]),
      ...weeks.map(w=>({key:w,label:`${fmtD(w)} haftası`,short:fmtDs(parseISO(w)),qty:byW[w]})),...(byW.none?[{key:"none",label:"Terminsiz",short:"Yok",qty:byW.none}]:[])];
    return{lines:L.length,qty,customers:cust.size,products:prods.length,prods,net,netUnknown,est,overdue,overQty,buckets,aging,agingN}},

  /* üretim gerçekleşmeleri: yalnızca Üretim Girişi kayıtları */
  production(S,f,pp){const recs=(S.production||[]).filter(r=>Dash.inRange(r.date,f)&&(!f.machine||r.machine===f.machine)&&Dash.partMatch(pp,r.part,f.product));
    const T={good:0,scrap:0};const byDay={},byM={},byR={};
    for(const r of recs){const g=+r.good||0,s=+r.scrap||0;T.good+=g;T.scrap+=s;
      const D=byDay[r.date]=byDay[r.date]||{good:0,scrap:0};D.good+=g;D.scrap+=s;(byM[r.machine]=byM[r.machine]||[]).push(r);
      if(+r.downH>0){const k=String(r.reason||"").trim()||"Neden girilmemiş";byR[k]=(byR[k]||0)+(+r.downH)}}
    T.scrapRate=T.good+T.scrap>0?T.scrap/(T.good+T.scrap):null;
    return{recs,T,days:Object.keys(byDay).sort().map(d=>({date:d,...byDay[d]})),byM,reasons:Object.entries(byR).sort((a,b)=>b[1]-a[1])}},
  /* OEE = Kullanılabilirlik × Performans × Kalite. Gerekli alan boşsa bileşen null kalır. */
  oee(S,recs){const molds={};S.molds.forEach(k=>{if(!molds[k.part])molds[k.part]=k});
    let run=0,down=0,runN=0,downN=0,ideal=0,idealN=0,good=0,scrap=0;
    for(const r of recs){const g=+r.good||0,s=+r.scrap||0;good+=g;scrap+=s;const hasRun=r.runH!==""&&r.runH!=null&&!isNaN(+r.runH);
      if(hasRun){run+=+r.runH;runN++}if(r.downH!==""&&r.downH!=null&&!isNaN(+r.downH)){down+=+r.downH;downN++}
      const k=molds[r.part];if(hasRun&&k&&+k.cycle>0&&+k.cav>0){ideal+=(g+s)*(+k.cycle)/(+k.cav)/3600;idealN++}}
    const n=recs.length;const A=n&&runN===n&&downN===n&&run+down>0?run/(run+down):null;
    const P=n&&idealN===n&&run>0?ideal/run:null;const Q=good+scrap>0?good/(good+scrap):null;
    const why=[];if(n&&(runN<n||downN<n))why.push(`${n-Math.min(runN,downN)} kayıtta çalışma/duruş süresi boş`);if(n&&idealN<n)why.push(`${n-idealN} kayıtta çevrim süresi bulunamadı`);
    return{A,P,Q,OEE:A!=null&&P!=null&&Q!=null?A*P*Q:null,run,down,good,scrap,n,why}},

  /* makine plan yükü: takvimdeki iş saatleri, seçili tarih aralığına kırpılmış */
  machinePlan(S,R,f,pp,t0){const H=+S.settings.horizon||22;const fromT=f.from?parseISO(f.from).getTime():null,toT=f.to?parseISO(f.to).getTime()+864e5:null;
    const endH=iso(R.days[Math.min(R.days.length-1,H-1)]||new Date());const days=(f.from||f.to)?Dash.workdays(f.from||t0,f.to||endH,!!S.settings.saturday):H;
    return S.machines.filter(m=>!f.machine||m.code===f.machine).map(m=>{let load=0,jobs=0;
      for(const s of R.lanes[m.code]||[]){if(!s.startDT||!s.end)continue;const parts=s.members?s.members.map(x=>x.part):[s.part];
        if(f.product&&!parts.some(p=>Dash.partMatch(pp,p,f.product))&&!(s.products||[]).some(p=>Dash.prodMatch(p,f.product)))continue;
        const a=s.startDT.getTime(),b=s.end.getTime(),lo=fromT==null?a:Math.max(a,fromT),hi=toT==null?b:Math.min(b,toT);if(hi<=lo)continue;
        load+=s.hrs*(b>a?(hi-lo)/(b-a):1);jobs++}
      const cap=netHours(m)*days;return{code:m.code,ton:m.ton,robot:hasRobot(m),load,cap,util:cap>0?load/cap:null,jobs,hourCost:m.hourCost===""||m.hourCost==null||isNaN(+m.hourCost)?null:+m.hourCost}})},

  /* kritik stok: MRP satırları, filtreye göre o dönemdeki/makinedeki/üründeki tüketim */
  stock(R,f){const anyF=f.from||f.to||f.machine||f.product;
    return R.mrp.rows.map(r=>{let g=0;for(const it of r.items){if(!Dash.inRange(it.date,f))continue;const ref=it.ref||{};
        if(ref.seg){if(f.machine&&ref.m!==f.machine)continue;if(f.product&&!(ref.seg.products||[]).some(p=>Dash.prodMatch(p,f.product)))continue}
        else{if(f.machine)continue;if(f.product&&!Dash.prodMatch(ref.product,f.product))continue}g+=it.qty}
      return{...r,fGross:anyF?g:r.gross}}).filter(r=>r.fGross>0)},

  /* standart maliyet: parça = hammadde + boya + makine saati; mamul = reçete toplamı. Eksik kalem varsa toplam verilmez. */
  cost(S,R){const st=S.settings,mats={};(S.materials||[]).forEach(m=>{mats[String(m.code).trim()]=m});
    const price=c=>{const m=mats[String(c||"").trim()];return m&&m.price!==""&&m.price!=null&&!isNaN(+m.price)?+m.price:null};
    const mach={};S.machines.forEach(m=>mach[m.code]=m);const jobM={};(R.jobs||[]).forEach(j=>(j.members||[{part:j.part}]).forEach(x=>{if(j.machine&&!jobM[x.part])jobM[x.part]=j.machine}));
    const moldOf={};S.molds.forEach(k=>{if(!moldOf[k.part])moldOf[k.part]=k});const mbDef=st.mbDefault==null?0.02:+st.mbDefault;
    const partCost=part=>{const k=moldOf[part];if(!k)return{mat:null,mach:null,miss:["kalıp kaydı"]};const miss=[];let mat=null,machC=null;
      const gPer=(+k.partG||0)+(+k.runnerG||0)/(+k.cav||1),mbC=String(k.mbCode||"").trim(),mb=(+k.mb>0)?+k.mb:(mbC?mbDef:0);
      if(!(+k.partG>0))miss.push("gramaj");else{const pm=price(k.mat);if(pm==null)miss.push(`${k.mat||"hammadde"} fiyatı`);else{mat=gPer/1000*(1-mb)*pm;
        if(mbC){const pb=price(mbC);if(pb==null){miss.push(`${mbC} fiyatı`);mat=null}else mat+=gPer/1000*mb*pb}}}
      const mc=jobM[part]||(k.machines||[])[0],m=mach[mc];
      if(!m||m.hourCost===""||m.hourCost==null||isNaN(+m.hourCost))miss.push(`${mc||"makine"} saat maliyeti`);else if(!(+k.cycle>0&&+k.cav>0))miss.push("çevrim/göz");
      else machC=(+k.cycle)/(+k.cav)/3600/((+m.eff)||1)*(+m.hourCost);return{mat,mach:machC,miss,machine:mc}};
    const bomBy={};S.bom.forEach(b=>{(bomBy[b.product]=bomBy[b.product]||[]).push(b)});const memo={};
    const linesOf=p=>{if(bomBy[p])return bomBy[p];if(moldOf[p])return[{part:p,qty:1,cat:"Yarı mamul"}];
      if(st.autoBom!==false){const re=new RegExp("^"+String(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"-\\d+$");const subs=[...new Set(S.molds.filter(k=>re.test(k.part)).map(k=>k.part))];if(subs.length)return subs.map(s=>({part:s,qty:1,cat:"Yarı mamul"}))}return null};
    const prodCost=(p,depth)=>{if(memo[p])return memo[p];const o={mat:0,mach:0,buy:0,miss:new Set()};memo[p]=o;const lines=linesOf(p);
      if(!lines){o.miss.add("reçete");return o}
      for(const b of lines){const q=(+b.qty||0)*(1+(+b.scrap||0));
        if(isProd(b)){if(moldOf[b.part]){const c=partCost(b.part);c.miss.forEach(x=>o.miss.add(x));if(c.mat!=null)o.mat+=c.mat*q;if(c.mach!=null)o.mach+=c.mach*q}
          else if(bomBy[b.part]&&depth<6){const c=prodCost(b.part,depth+1);o.mat+=c.mat*q;o.mach+=c.mach*q;o.buy+=c.buy*q;c.miss.forEach(x=>o.miss.add(x))}
          else o.miss.add(`${b.part} kalıp/reçete`)}
        else{const pr=price(b.part);if(pr==null)o.miss.add(`${b.part} fiyatı`);else o.buy+=pr*q*((b.unit||"")==="gr"?0.001:1)}}
      return o};
    const products=Object.entries(R.prod).filter(([,P])=>P.qty>0).map(([code,P])=>{const c=prodCost(code,0);const ok=c.miss.size===0;const unit=c.mat+c.mach+c.buy;
      return{code,need:P.qty,mat:c.mat,mach:c.mach,buy:c.buy,unit:ok?unit:null,total:ok?unit*P.qty:null,miss:[...c.miss]}});
    const buyRows=R.mrp.rows.filter(r=>r.order>0).map(r=>({code:r.code,type:r.type,unit:r.unit,order:r.order,price:price(r.code),value:price(r.code)==null?null:price(r.code)*r.order}));
    return{products,buyRows,price}},

  /* veri eksikleri raporu */
  gaps(S,R){const G=[];const add=(sev,title,detail,have,total,fix)=>G.push({sev,title,detail,have,total,fix});
    const pr=(S.production||[]).length;
    add(pr?"ok":"bad","Üretim gerçekleşmeleri",pr?`${pr} kayıt var.`:"Hiç üretim kaydı yok. Gerçekleşen üretim, fire ve makine verimi (OEE) hesaplanamıyor.",pr,null,"uretim");
    if(pr){const o=Dash.oee(S,S.production);if(o.why.length)add("warn","Üretim kayıtlarında boş alan",o.why.join(" · ")+". Bu kayıtlar OEE'ye girmez.",null,null,"uretim")}
    const nm=S.molds.length,noW=S.molds.filter(k=>!(+k.partG>0)).length;
    add(!nm?"bad":noW===nm?"bad":noW?"warn":"ok","Parça gramajı",noW?`${noW} kalıpta parça gramajı yok. Bu parçaların hammadde ihtiyacı ve maliyeti hesaplanamıyor.`:"Tüm kalıplarda gramaj var.",nm-noW,nm,"kaliplar");
    const needP=Object.values(R.prod).filter(p=>p.qty>0).length;
    add(R.unmatched.length?"warn":"ok","Mamul reçetesi",R.unmatched.length?`İhtiyacı olan ${R.unmatched.length} mamul kalıba bağlanamıyor; plana, MRP'ye ve maliyete girmiyor.`:"İhtiyacı olan tüm mamuller kalıba bağlı.",needP-R.unmatched.length,needP,"agac");
    const rows=R.mrp.rows,noCard=rows.filter(r=>!r.hasCard).length;
    if(rows.length)add(noCard?"warn":"ok","Malzeme stok kartları",noCard?`MRP'de geçen ${noCard} malzemenin stok kartı yok; stokları 0 sayılıyor.`:"MRP'deki tüm malzemelerin stok kartı var.",rows.length-noCard,rows.length,"malzemeler");
    const mats={};(S.materials||[]).forEach(m=>mats[String(m.code).trim()]=m);const codes=[...new Set([...rows.map(r=>r.code),...S.molds.map(k=>String(k.mat||"").trim()).filter(Boolean)])];
    const noPrice=codes.filter(c=>{const m=mats[c];return!m||m.price===""||m.price==null||isNaN(+m.price)}).length;
    if(codes.length)add(noPrice===codes.length?"bad":noPrice?"warn":"ok","Malzeme birim fiyatı",noPrice?`${noPrice} malzemenin fiyatı yok. Maliyet analizi bu kalemler için yapılamıyor.`:"Tüm malzemelerin fiyatı var.",codes.length-noPrice,codes.length,"malzemeler");
    const noHC=S.machines.filter(m=>m.hourCost===""||m.hourCost==null||isNaN(+m.hourCost)).length;
    add(noHC===S.machines.length?"bad":noHC?"warn":"ok","Makine saat maliyeti",noHC?`${noHC} makinenin saat maliyeti yok. Makine maliyeti hesaplanamıyor.`:"Tüm makinelerin saat maliyeti var.",S.machines.length-noHC,S.machines.length,"makineler");
    const lead=S.settings.leadDays==null?30:+S.settings.leadDays,est=S.orders.filter(o=>Dash.dueEst(o,lead)).length;
    if(S.orders.length)add(est?"warn":"ok","Sipariş terminleri",est?`${est} siparişin termini gerçek değil; sipariş tarihi + ${lead} gün olarak tahmin edildi. Gecikme ve termin grafikleri tahmindir.`:"Terminler dosyadan geliyor.",S.orders.length-est,S.orders.length,null);
    const def=S.machines.filter(m=>+m.shifts===3&&+m.hours===7.5&&+m.eff===0.85).length;
    if(def)add("info","Makine kapasitesi",`${def} makine varsayılan değerlerde (3 vardiya × 7,5 saat, %85 verim). Gerçek değerler farklıysa doluluk yanlış görünür.`,S.machines.length-def,S.machines.length,"makineler");
    const run=S.machines.filter(m=>String(m.rPart||"").trim()).length;
    if(!run&&S.machines.length)add("info","Makinede çalışan işler","Hiçbir makinede çalışan iş girilmemiş; plan bütün makineler boşmuş gibi başlıyor.",0,S.machines.length,"takvim");
    const rank={bad:0,warn:1,info:2,ok:3};return G.sort((a,b)=>rank[a.sev]-rank[b.sev])}
};

const Chart={
  specs:[],
  tip(){let t=document.getElementById("chTip");if(!t){t=document.createElement("div");t.id="chTip";t.className="ch-tip";t.hidden=true;document.body.append(t)}return t},
  bind(root){const t=Chart.tip();root.querySelectorAll("[data-tip]").forEach(el=>{
    const show=e=>{t.innerHTML=el.getAttribute("data-tip");t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;
      t.style.left=Math.min(window.innerWidth-w-8,Math.max(8,e.clientX+14))+"px";t.style.top=(e.clientY-h-14<8?e.clientY+18:e.clientY-h-14)+"px"};
    el.addEventListener("pointerenter",show);el.addEventListener("pointermove",show);el.addEventListener("pointerleave",()=>{t.hidden=true})})},
  ticks(max){const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw||1)));const step=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw)||p*10;const out=[];for(let v=0;v<=max+step*0.001;v+=step)out.push(v);if(out[out.length-1]<max)out.push(out[out.length-1]+step);return out},
  short(v){const a=Math.abs(v);return a>=1e6?nf1.format(v/1e6)+" M":a>=1e4?nf0.format(v/1e3)+" B":a>=1e3?nf1.format(v/1e3)+" B":nf0.format(v)},
  bar(x,y,w,h,color,round){if(h<=0)return"";const r=round?Math.min(4,w/2,h):0;
    return r?`<path d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z" fill="${color}" class="ch-mark"/>`:`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" class="ch-mark"/>`},
  /* dikey çubuk (yığılmış): cats=[{key,label,short,color?}], series=[{name,color,values}] */
  vbar(el,{cats,series,fmt=v=>nf0.format(v),unit="",h=230,onClick}){const W=Math.max(260,el.clientWidth||600),padL=46,padR=6,padT=10,padB=30,ph=h-padT-padB,pw=W-padL-padR;
    const tot=cats.map((c,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0)),tk=Chart.ticks(Math.max(1,...tot)),top=tk[tk.length-1];
    const step=pw/Math.max(1,cats.length),bw=Math.max(3,Math.min(44,step*0.68)),every=Math.max(1,Math.ceil(cats.length/Math.max(1,Math.floor(pw/58))));
    let g=tk.map(v=>{const y=padT+ph-v/top*ph;return`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" class="ch-grid"/><text x="${padL-7}" y="${y+4}" class="ch-ax" text-anchor="end">${Chart.short(v)}</text>`}).join("");
    cats.forEach((c,i)=>{const x=padL+step*i+(step-bw)/2;let y0=padT+ph;const last=series.map((s,si)=>s.values[i]>0?si:-1).reduce((a,b)=>Math.max(a,b),-1);
      series.forEach((s,si)=>{const v=s.values[i]||0;if(v<=0)return;const hh=v/top*ph;g+=Chart.bar(x,y0-hh,bw,hh,(series.length===1&&c.color)||s.color,si===last);y0-=hh});
      const tip=`<div class="t-h">${esc(c.label)}</div>`+series.map(s=>`<div><i style="background:${(series.length===1&&c.color)||s.color}"></i>${esc(s.name)} <b>${fmt(s.values[i]||0)}${unit}</b></div>`).join("")+(series.length>1?`<div class="t-f">Toplam <b>${fmt(tot[i])}${unit}</b></div>`:"");
      g+=`<rect x="${padL+step*i}" y="${padT}" width="${step}" height="${ph}" fill="transparent" class="ch-hit${onClick?" ch-click":""}" data-tip="${esc(tip)}" ${onClick?`data-click="${esc(c.key)}"`:""}/>`;
      if(i%every===0)g+=`<text x="${x+bw/2}" y="${h-padB+17}" class="ch-ax" text-anchor="middle">${esc(c.short||c.label)}</text>`});
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${padT+ph}" y2="${padT+ph}" class="ch-base"/>`;
    el.innerHTML=`<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(el.dataset.label||"")}">${g}</svg>`;Chart.bind(el);
    if(onClick)el.querySelectorAll("[data-click]").forEach(r=>r.addEventListener("click",()=>onClick(r.dataset.click)))},
  /* yatay çubuk (sıralama): rows=[{key,label,sub,values:[...],valueText,color?}] */
  hbar(el,{rows,series,fmt=v=>nf0.format(v),unit="",ref,refLabel,onClick,max,grouped}){const mx=max||Math.max(1e-9,...rows.map(r=>grouped?Math.max(...r.values.map(v=>v||0)):r.values.reduce((a,b)=>a+(b||0),0)),ref||0);

      const segs=r.values.map((v,i)=>grouped?`<span class="hb-line"><span class="hb-seg" style="width:${Math.max(0,v||0)/mx*100}%;background:${series[i].color}"></span></span>`:v>0?`<span class="hb-seg" style="width:${v/mx*100}%;background:${(series.length===1&&r.color)||series[i].color}"></span>`:"").join("");

      return`<div class="hb-row${onClick?" ch-click":""}" data-tip="${esc(tip)}" ${onClick?`data-click="${esc(r.key)}" tabindex="0" role="button"`:""}><span class="hb-label"><span class="code">${esc(r.label)}</span>${r.sub?`<small>${esc(r.sub)}</small>`:""}</span>

  legend(series){return`<div class="ch-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`},
  mountAll(root){root.querySelectorAll("[data-ch]").forEach(el=>{const sp=Chart.specs[+el.dataset.ch];if(sp)Chart[sp.type](el,sp.opt)})},

const COL={c1:"var(--s1)",c2:"var(--s2)",c3:"var(--s3)",c4:"var(--s4)",ok:"var(--ok)",warn:"var(--warn)",bad:"var(--bad)",muted:"var(--muted)"};

const DKEY="planpres-dash";
function dashF(){if(!ui.dash){let v=null;try{v=JSON.parse(localStorage.getItem(DKEY)||"null")}catch(e){}ui.dash=v&&typeof v==="object"?v:{preset:"all",from:"",to:"",machine:"",product:""}}return ui.dash}
function setDashF(p){Object.assign(dashF(),p);try{localStorage.setItem(DKEY,JSON.stringify(ui.dash))}catch(e){}const sy=window.scrollY;render();window.scrollTo(0,sy)}
function presetRange(p,t0){const d=parseISO(t0),add=n=>{const x=new Date(d);x.setDate(x.getDate()+n);return iso(x)};
  if(p==="p7")return{from:add(-6),to:t0};if(p==="p30")return{from:add(-29),to:t0};if(p==="n30")return{from:t0,to:add(30)};
  if(p==="month"){const a=new Date(d.getFullYear(),d.getMonth(),1),b=new Date(d.getFullYear(),d.getMonth()+1,0);return{from:iso(a),to:iso(b)}}return{from:"",to:""}}
const pct1=v=>v==null?"–":nf1.format(v*100)+"%";
const tl=v=>v==null?"–":(Math.abs(v)>=1e5?nf0.format(v):new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(v))+" TL";
function emptyBox(title,detail,fix,fixLabel){return`<div class="ch-empty"><b>${esc(title)}</b><span>${esc(detail)}</span>${fix?`<button class="btn btn-sm" type="button" data-go="${esc(fix)}">${esc(fixLabel||"Veriyi tamamla")}</button>`:""}</div>`}

      ${P.reasons.length?`<h3 class="ch-sub">Duruş nedenleri (saat)</h3>${Chart.slot("hbar",{rows:P.reasons.slice(0,8).map(([k,v])=>({key:k,label:k,values:[v]})),series:[{name:"Duruş",color:COL.c4}],fmt:v=>nf1.format(v),unit:" sa"},"Duruş nedenleri")}`:""}
      ${dataTable([{l:"Tarih"},{l:"Sağlam",r:1},{l:"Fire",r:1}],P.days.map(d=>[fmtD(d.date),nf0.format(d.good),nf0.format(d.scrap)]))}`
    :emptyBox("Üretim gerçekleşmesi verisi yok",(S.production||[]).length?"Seçili filtrelerde üretim kaydı yok.":"Sistemde hiç üretim kaydı yok. Sahte veri gösterilmez; Üretim Girişi ekranından günlük sağlam/fire adetlerini, çalışma ve duruş sürelerini girin ya da Excel ile yükleyin.",(S.production||[]).length?null:"uretim","Üretim Girişi'ne git");

  // 2 · Makine performansı
  const utilColor=u=>u==null?COL.muted:u>1?COL.bad:u>0.85?COL.warn:COL.c1;
  const mpRows=MP.filter(m=>m.cap>0).sort((a,b)=>(b.util||0)-(a.util||0));
  const mxU=Math.max(1.05,...mpRows.map(m=>m.util||0));

      <div class="ch-legend"><span><i style="background:var(--s1)"></i>%85'e kadar</span><span><i style="background:var(--warn)"></i>%85–100 · yoğun</span><span><i style="background:var(--bad)"></i>%100 üstü · kapasite aşıyor</span></div>`:emptyBox("Plan doluluğu yok","Seçili filtrelerde planlanmış iş ya da kapasitesi tanımlı makine yok.",null))
    +`<h3 class="ch-sub">Gerçekleşen verim (OEE)</h3>`+(oeeByM.length?Chart.slot("hbar",{rows:oeeByM.map(x=>({key:x.m,label:x.m,sub:`K ${pct1(x.o.A)} · P ${pct1(x.o.P)} · Ka ${pct1(x.o.Q)}`,values:[x.o.OEE]})),series:[{name:"OEE",color:COL.c3}],fmt:v=>pct1(v),max:1,onClick:goMachine},"OEE")

  // 3 · Açık siparişler
  const sOrd={name:"Kalan sipariş",color:COL.c1};

      ${O.overdue?`<div class="hint"><span class="pill pill-bad">Gecikmiş</span> ${O.overdue} satır · ${nf0.format(O.overQty)} adet termini geçmiş</div>`:""}
      <h3 class="ch-sub">En yüksek net ihtiyaç <span class="hint">· tıklayınca ürün filtrelenir</span></h3>${Chart.slot("hbar",{rows:topP.map(p=>({key:p.code,label:p.code,sub:`${p.lines} sipariş · stok ${p.stock==null?"bilinmiyor":nf0.format(p.stock)}`,values:p.net==null?[0,p.qty]:[p.net,0],valueText:p.net==null?`${nf0.format(p.qty)} (stok yok)`:nf0.format(p.net)})),series:[{name:"Net ihtiyaç",color:COL.c1},{name:"Kalan (stok bilinmiyor)",color:COL.muted}],onClick:goProduct},"Net ihtiyaç")}
      ${O.agingN?`<h3 class="ch-sub">Sipariş yaşı (adet)</h3>${Chart.slot("hbar",{rows:Object.entries(O.aging).map(([k,v])=>({key:k,label:k,values:[v]})),series:[{name:"Kalan sipariş",color:COL.c1}],unit:" ad"},"Sipariş yaşı")}`:""}
      ${dataTable([{l:"Mamul"},{l:"Satır",r:1},{l:"Kalan",r:1},{l:"Stok",r:1},{l:"Net ihtiyaç",r:1},{l:"En erken termin"}],O.prods.slice().sort((a,b)=>(b.net??b.qty)-(a.net??a.qty)).map(p=>[`<span class="code">${esc(p.code)}</span>`,p.lines,nf0.format(p.qty),p.stock==null?"–":nf0.format(p.stock),p.net==null?"–":nf0.format(p.net),fmtD(p.due)]))}`
    :emptyBox("Açık sipariş yok","Seçili filtrelerde sipariş bulunamadı.",null);

  // 4 · Kritik stoklar
  const critTop=crit.slice(0,10);
  const stHtml=ST.length?(critTop.length?Chart.legend([{name:"Stok + yolda",color:COL.c3},{name:"Dönem ihtiyacı",color:COL.c2}])+Chart.slot("hbar",{rows:critTop.map(r=>({key:r.code,label:r.code,sub:`${r.type} · ${r.status}${r.orderBy?` · son sipariş ${fmtD(r.orderBy)}`:""}`,values:[r.stock+r.inc,r.fGross],valueText:`${r.order>0?`${nf0.format(Math.ceil(r.order))} ${r.unit} sipariş`:"sipariş yok"}`})),series:[{name:"Stok + yolda",color:COL.c3},{name:"Dönem ihtiyacı",color:COL.c2}],fmt:v=>Chart.short(v),grouped:true},"Kritik stok"):`<div class="ch-ok"><span class="pill pill-ok">Yeterli</span> Stok kartı olan malzemelerde kritik durum yok.</div>`)
      +(noCardSt?`<div class="hint" style="margin-top:8px"><span class="pill pill-warn">Bilinmiyor</span> ${noCardSt} malzemenin stok kartı yok; durumu değerlendirilemiyor. <button class="btn btn-sm" type="button" data-go="malzemeler">Stokları gir</button></div>`:"")
      +dataTable([{l:"Malzeme"},{l:"Tip"},{l:"Dönem ihtiyacı",r:1},{l:"Stok",r:1},{l:"Yolda",r:1},{l:"Sipariş önerisi",r:1},{l:"Son sipariş"},{l:"Durum"}],ST.map(r=>[`<span class="code">${esc(r.code)}</span>`,esc(r.type),`${Chart.short(r.fGross)} ${r.unit}`,r.hasCard?nf0.format(r.stock):"–",r.hasCard?nf0.format(r.inc):"–",r.order>0?nf0.format(Math.ceil(r.order)):"–",r.orderBy?fmtD(r.orderBy):"–",pill(r.hasCard?r.level:"warn",r.hasCard?r.status:"Stok kartı yok")]))
    :emptyBox("Malzeme ihtiyacı hesaplanamadı","Gramaj ya da reçetede satınalma kalemi girilmediği için MRP'de malzeme yok.","kaliplar","Gramajları gir");

  const missCount={};cProds.filter(p=>p.total==null).forEach(p=>p.miss.forEach(m=>{const k=/ fiyatı$/.test(m)?"malzeme fiyatı":/ saat maliyeti$/.test(m)?"makine saat maliyeti":/kalıp\/reçete$/.test(m)?"alt parça kalıbı/reçetesi":m;missCount[k]=(missCount[k]||0)+1}));
  const mCost=MP.filter(m=>m.hourCost!=null&&m.load>0).map(m=>({code:m.code,v:m.load*m.hourCost})).sort((a,b)=>b.v-a.v);
  const buyVal=C.buyRows.filter(r=>r.value!=null),buyTot=buyVal.reduce((a,r)=>a+r.value,0);

      :emptyBox("Mamul maliyeti hesaplanamıyor","Sahte fiyat kullanılmaz. Malzemelere birim fiyat, makinelere saat maliyeti ve kalıplara gramaj girildiğinde mamul maliyetleri burada görünür.","malzemeler","Fiyatları gir"))
    +(mCost.length?`<h3 class="ch-sub">Planlanan makine maliyeti</h3>${Chart.slot("hbar",{rows:mCost.map(m=>({key:m.code,label:m.code,values:[m.v]})),series:[{name:"Plan saati × saat maliyeti",color:COL.c2}],fmt:tl,onClick:goMachine},"Makine maliyeti")}`:"")
    +(C.buyRows.length?`<div class="hint" style="margin-top:10px">Satınalma önerisi tutarı: <b>${buyVal.length?tl(buyTot):"hesaplanamıyor"}</b> ${buyVal.length<C.buyRows.length?`(${C.buyRows.length-buyVal.length} kalemin fiyatı yok)`:""}</div>`:"")

  $("#view").innerHTML=`
  ${S.demo?`<div class="panel"><div class="panel-body hint"><span class="pill pill-warn">Örnek veri</span> Bu panel şu an örnek verileri gösteriyor. Örnek veride üretim gerçekleşmesi ve fiyat yoktur.</div></div>`:""}

  <section class="kpis dash-kpis">
    ${kpi("Açık sipariş",nf0.format(O.qty),`${nf0.format(O.lines)} satır · ${nf0.format(O.customers)} müşteri`)}
    ${kpi("Net ihtiyaç",nf0.format(O.net),O.netUnknown?`${O.netUnknown} üründe stok bilinmiyor`:`${O.products} ürün · stok düşülmüş`)}
    ${kpi("Plan doluluğu",capT?pct(loadT/capT):"–",`${nf0.format(loadT)} saat planlı iş`,capT&&loadT/capT>1?"is-bad":"")}
    ${kpi("Gerçekleşen üretim",P.recs.length?nf0.format(P.T.good):"Veri yok",P.recs.length?`fire ${pct1(P.T.scrapRate)} · OEE ${OE.OEE==null?"–":pct1(OE.OEE)}`:"Üretim Girişi'nden kayıt girin",P.recs.length?"":"is-muted")}

  </section>

  <section class="dash-grid">
    <div class="panel ch-card span2"><div class="panel-head"><h2 class="panel-title">Üretim gerçekleşmeleri</h2><span class="panel-sub">Üretim Girişi kayıtları · ${nf0.format(P.recs.length)} kayıt</span></div><div class="panel-body">${prodHtml}</div></div>
    <div class="panel ch-card"><div class="panel-head"><h2 class="panel-title">Makine performansı</h2><span class="panel-sub">Plan: takvim · Gerçekleşen: üretim kayıtları</span></div><div class="panel-body">${machHtml}</div></div>
    <div class="panel ch-card"><div class="panel-head"><h2 class="panel-title">Açık siparişler</h2><span class="panel-sub">${nf0.format(O.products)} ürün · ${nf0.format(O.qty)} adet kalan</span></div><div class="panel-body">${ordHtml}</div></div>

    <div class="panel ch-card"><div class="panel-head"><h2 class="panel-title">Maliyet analizi</h2><span class="panel-sub">Standart maliyet: gramaj × fiyat + çevrim × saat maliyeti + reçete kalemleri</span></div><div class="panel-body">${costHtml}</div></div>
  </section>`;
  const v=$("#view");Chart.mountAll(v);
  v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $("#dfp").onchange=e=>{const p=e.target.value;setDashF(p==="custom"?{preset:"custom"}:{preset:p,...presetRange(p,t0)})};

  const c=$("#dfc");if(c)c.onclick=()=>setDashF({preset:"all",from:"",to:"",machine:"",product:""});
}
